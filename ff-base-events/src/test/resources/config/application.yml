# OutboxTest: an in-memory database, and an outbox in the schema "testbox".
spring:
  datasource:
    url: jdbc:h2:mem:outbox;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
ff:
  events:
    schema: testbox
    # The test runs the resubmission itself: the schedule far apart, the first wait zero.
    resubmit-delay: PT1H
    resubmit-min-age: PT0S
    max-attempts: 3
