# Defaults of every FF application (FfDefaults). An application's own application.yml, its
# environment variables and its arguments override any line here.
spring:
  threads:
    virtual:
      enabled: true
  # A sent record and a consumed record carry the W3C traceparent header, so a consumer continues
  # the producer's trace. An application without Kafka ignores the two lines.
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  jpa:
    hibernate:
      # Flyway owns the schema (MigrationArea); Hibernate only checks at start that the entities
      # match it.
      ddl-auto: validate
    # A request's database work happens in its service call, not while the response is written.
    open-in-view: false

logging:
  pattern:
    # Present once the OpenTelemetry starter is on the classpath. Empty until a span is current.
    correlation: "[%X{traceId:-},%X{spanId:-}] "

management:
  tracing:
    sampling:
      # Every request locally. Spring Boot's default is 0.1.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  logging:
    export:
      otlp:
        # Traces go to Jaeger. Logs stay on the process's own output.
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          # The chart sets this to http://jaeger:4318/v1/traces. From the IDE the host port is
          # not published; a failed export is logged and the process still serves.
          endpoint: ${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness and /readiness for the Kubernetes probes. Spring Boot turns these
      # on by itself only when it detects Kubernetes; on here so the IDE and the tests see the
      # same endpoints.
      probes:
        enabled: true
      group:
        # /actuator/health/release: may this release take traffic? Read by the canary analysis.
        # Always 200, with UP or DOWN in the body, so the analysis sees an answer rather than an
        # error. Not part of liveness or readiness.
        release:
          include: releaseSwitch
          status:
            http-mapping:
              down: 200
  info:
    git:
      mode: simple

ff:
  release:
    # false (FF_RELEASE_HEALTHY=false) turns /actuator/health/release DOWN, to show what a canary
    # analysis does with a broken release.
    healthy: true
