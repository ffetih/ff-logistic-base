# Defaults of every FF application (FfDefaults). An application's own application.yml, its
# environment variables and its arguments override any line here.
spring:
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      # Flyway owns the schema (MigrationArea); Hibernate only checks at start that the entities
      # match it.
      ddl-auto: validate
    # A request's database work happens in its service call, not while the response is written.
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness and /readiness for the Kubernetes probes. Spring Boot turns these
      # on by itself only when it detects Kubernetes; on here so the IDE and the tests see the
      # same endpoints.
      probes:
        enabled: true
      group:
        # /actuator/health/release: may this release take traffic? Read by the canary analysis.
        # Always 200, with UP or DOWN in the body, so the analysis sees an answer rather than an
        # error. Not part of liveness or readiness.
        release:
          include: releaseSwitch
          status:
            http-mapping:
              down: 200
  info:
    git:
      mode: simple

ff:
  release:
    # false (FF_RELEASE_HEALTHY=false) turns /actuator/health/release DOWN, to show what a canary
    # analysis does with a broken release.
    healthy: true
